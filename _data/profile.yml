short_bio: >-
  <p>
    I am a Research Scientist at <a href="https://seed.bytedance.com/en/">ByteDance Seed</a> focusing on 3D generative models.
    I earned my Ph.D. from Nanyang Technological University (NTU) supervised by Prof. 
    <a href="https://mreallab.github.io">Hanwang Zhang</a>. 
    Previously, I received my Master of Science degree from National University of Singapore (NUS), where I was advised by Prof. 
    <a href="https://sites.google.com/view/showlab">Mike Zheng Shou</a>. 
    I also collaborate closely with Prof. <a href="https://zjuchenlong.github.io">Long Chen</a> from HKUST and Prof. <a href="https://na-z.github.io">Na Zhao</a> from SUTD.<br />
  </p>


